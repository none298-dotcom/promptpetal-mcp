# Publishes @promptpetal/mcp to npm when a version tag is pushed (v1.2.1 and so on).
# npm trusted publishing: GitHub proves who is publishing with a short-lived token, so no
# npm password or key is stored anywhere. Set up once on npmjs.com, after the first
# publish: package settings, Trusted Publisher, GitHub Actions, this repo, publish.yml.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
